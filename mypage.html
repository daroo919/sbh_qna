<!DOCTYPE html>
<html lang="ko">

<head>
  <link rel="icon" href="./favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>求援 - 마이페이지</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 마이페이지 전용 추가 스타일 (유리 질감 유지) */
    .profile-card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.05);
    }

    .field { margin-bottom: 20px; }
    .label { font-size: 14px; color: #64748b; margin-bottom: 8px; font-weight: 600; }
    
    .input-box, .upload-box {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.5);
      box-sizing: border-box;
      font-size: 15px;
    }

    /* 잔디밭 가기 버튼 (힐링 그린 스타일) */
    .grass-btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: none;
      background: linear-gradient(135deg, #a7d08c 0%, #7db344 100%);
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 12px; /* 저장 버튼과의 간격 */
      transition: 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(125, 179, 68, 0.2);
    }

    .grass-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(125, 179, 68, 0.3);
      filter: brightness(1.05);
    }

    .save-btn {
      width: 100%;
      padding: 14px;
      border-radius: 16px;
      border: 1px solid #e2e8f0;
      background: #0f172a;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    .save-btn:hover { background: #1e293b; }
  </style>
</head>

<body>
  <header class="header">
    <div class="logo" onclick="location.href='main.html'">求援<span class="dot">.</span></div>
    <div class="header-right">
      <div class="points" id="hPoints">0P</div>
      <div class="nickname" id="hNick" onclick="location.href='mypage.html'">로딩 중...</div>
      <button class="logout" id="logoutBtn">로그아웃</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="menu-item" onclick="location.href='qna.html'">📄 문답</div>
      <div class="menu-item" onclick="location.href='talk.html'">👤 잡담</div>
      <div class="menu-item" onclick="location.href='point.html'">💰 포인트 관리</div>
      <div class="menu-item active" onclick="location.href='mypage.html'">⚙️ 마이페이지</div>
    </aside>

    <main class="main">
      <div class="profile-card">
        <h2 style="margin-top:0; color:#0f172a;">내 프로필 설정</h2>

        <div class="field">
          <div class="label">계정 이메일</div>
          <div id="emailDisp" style="font-weight: 500; color:#334155;">-</div>
        </div>

        <div class="field">
          <div class="label">닉네임 변경</div>
          <input type="text" id="nickInput" class="input-box" placeholder="닉네임 입력">
        </div>

        <div class="field">
          <div class="label">나만의 배경 이미지</div>
          <div style="display: flex; gap: 10px;">
            <div class="upload-box" onclick="document.getElementById('fileInput').click()" style="flex: 1; cursor:pointer;">
              <span id="fileName">🖼️ 배경 사진 선택</span>
              <input type="file" id="fileInput" accept="image/*" style="display:none">
            </div>
            <button id="delBgBtn"
              style="padding: 0 15px; border-radius: 16px; border: 1px solid #ef4444; background: rgba(239, 68, 68, 0.05); color: #ef4444; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 13px;">삭제</button>
          </div>
          <p style="font-size: 11px; color: #94a3b8; margin-top: 8px;">* 사진을 저장하면 모든 페이지의 배경이 바뀝니다.</p>
        </div>

        <button class="grass-btn" onclick="location.href='grass.html'">
          🌿 나만의 잔디밭으로 가기 (ASMR)
        </button>
        
        <button id="saveBtn" class="save-btn">변경사항 저장하기</button>
      </div>
    </main>
  </div>

  <nav class="bottom-tab">
    <a href="qna.html" class="tab-item"><span class="tab-icon">📄</span><span>문답</span></a>
    <a href="talk.html" class="tab-item"><span class="tab-icon">👤</span><span>잡담</span></a>
    <a href="point.html" class="tab-item"><span class="tab-icon">💰</span><span>포인트</span></a>
    <a href="mypage.html" class="tab-item active"><span class="tab-icon">⚙️</span><span>마이</span></a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    const fileInput = document.getElementById('fileInput');
    let selectedFile = null;

    fileInput.onchange = e => {
      selectedFile = e.target.files[0];
      if (selectedFile) document.getElementById('fileName').innerText = "✅ 선택됨: " + selectedFile.name;
    };

    onAuthStateChanged(auth, async u => {
      if (!u) return location.href = "login.html";

      const s = await getDoc(doc(db, "users", u.uid));
      if (s.exists()) {
        const d = s.data();
        const localBg = localStorage.getItem(`bg_${u.uid}`);
        if (localBg) {
          document.body.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.4)), url('${localBg}')`;
        }
        document.getElementById("hNick").innerText = d.nickname;
        document.getElementById("hPoints").innerText = (d.points || 0) + "P";
        document.getElementById("emailDisp").innerText = u.email;
        document.getElementById("nickInput").value = d.nickname;
      }
    });

    document.getElementById("delBgBtn").onclick = () => {
      const user = auth.currentUser;
      if (!user) return;
      if (confirm("배경 이미지를 삭제하고 기본 배경으로 돌아갈까요?")) {
        localStorage.removeItem(`bg_${user.uid}`);
        alert("기본 배경으로 복구되었습니다! ✨");
        location.reload();
      }
    };

    document.getElementById("saveBtn").onclick = async () => {
      const user = auth.currentUser;
      const newNick = document.getElementById("nickInput").value.trim();
      if(!newNick) return alert("닉네임을 입력해주세요.");

      try {
        await updateDoc(doc(db, "users", user.uid), { nickname: newNick });

        if (selectedFile) {
          const reader = new FileReader();
          reader.onload = function (e) {
            localStorage.setItem(`bg_${user.uid}`, e.target.result);
            alert("프로필과 배경이 저장되었습니다! ✨");
            location.reload();
          };
          reader.readAsDataURL(selectedFile);
        } else {
          alert("닉네임이 성공적으로 변경되었습니다!");
          location.reload();
        }
      } catch (e) {
        console.error(e);
        alert("저장 중 오류가 발생했습니다.");
      }
    };

    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", () => {
        if (confirm("로그아웃 하시겠습니까?")) {
          signOut(auth).then(() => {
            alert("로그아웃 되었습니다.");
            location.href = "login.html";
          }).catch(err => console.error("로그아웃 실패:", err));
        }
      });
    }
  </script>
</body>
</html>
