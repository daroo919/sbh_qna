<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>회원가입</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h2>회원가입</h2>

<input type="email" id="email" placeholder="이메일"><br><br>
<input type="text" id="nickname" placeholder="닉네임"><br><br>
<input type="password" id="password" placeholder="비밀번호"><br><br>

<button id="signupBtn">회원가입</button>

<script type="module">

import { signupUser } from "./firebase.js";

document.getElementById("signupBtn").addEventListener("click", async () => {

  const email = document.getElementById("email").value.trim();
  const nickname = document.getElementById("nickname").value.trim();
  const password = document.getElementById("password").value.trim();

  if (!email || !nickname || !password) {
    alert("전부 입력하세요.");
    return;
  }

  try {
    await signupUser(email, password, nickname);
    alert("회원가입 성공!");
    location.href = "login.html";
  } catch (err) {
    alert(err.message);
  }
});

</script>

</body>
</html>
