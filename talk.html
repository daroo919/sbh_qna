<!DOCTYPE html>
<html lang="ko">

<head>
  <link rel="icon" href="./favicon.ico">

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>求援 - 대합실</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', -apple-system, sans-serif;

      background:
        linear-gradient(
          rgba(5,10,20,0.72),
          rgba(5,10,20,0.82)
        ),
        url("station.png");

      background-size: cover;
      background-position: center;
      background-attachment: fixed;

      color: white;

      min-height: 100vh;

      padding-bottom: 80px;
    }

    .header {
      height: 70px;

      padding: 0 20px;

      background: rgba(8,15,28,0.68);

      backdrop-filter: blur(14px);

      display: flex;
      justify-content: space-between;
      align-items: center;

      border-bottom: 1px solid rgba(255,255,255,0.06);

      position: sticky;
      top: 0;

      z-index: 100;
    }

    .logo {
      font-size: 22px;
      font-weight: 800;

      color: white;

      cursor: pointer;
    }

    .dot {
      color: #60a5fa;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;

      font-size: 13px;
    }

    .points {
      color: #93c5fd;

      font-weight: 700;

      background: rgba(59,130,246,0.12);

      padding: 5px 11px;

      border-radius: 20px;
    }

    .nickname {
      color: rgba(241,245,249,0.9);

      cursor: pointer;
    }

    .logout {
      cursor: pointer;

      padding: 7px 13px;

      border-radius: 10px;

      border: 1px solid rgba(255,255,255,0.08);

      background: rgba(255,255,255,0.05);

      color: white;

      font-size: 12px;
      font-weight: bold;

      transition: 0.25s;
    }

    .logout:hover {
      background: rgba(255,255,255,0.12);
    }

    .layout {
      display: flex;
    }

    .sidebar {
      width: 220px;

      padding-top: 20px;

      background: rgba(8,15,28,0.45);

      backdrop-filter: blur(16px);

      border-right: 1px solid rgba(255,255,255,0.05);

      min-height: calc(100vh - 70px);
    }

    .menu-item {
      padding: 15px 20px;

      cursor: pointer;

      transition: 0.25s;

      color: rgba(226,232,240,0.76);

      font-weight: 500;
    }

    .menu-item:hover {
      background: rgba(255,255,255,0.05);

      color: white;
    }

    .main {
      flex: 1;

      padding: 25px;

      max-width: 700px;

      margin: 0 auto;

      display: flex;
      flex-direction: column;

      align-items: center;
    }

    .station-message {
      width: 100%;

      margin-bottom: 22px;

      padding: 18px 22px;

      border-radius: 22px;

      background: rgba(15,23,42,0.55);

      border: 1px solid rgba(255,255,255,0.06);

      backdrop-filter: blur(10px);

      color: rgba(241,245,249,0.88);

      line-height: 1.7;

      font-size: 14px;
    }

    .input-row {
      width: 100%;

      display: flex;

      gap: 10px;

      margin-bottom: 25px;
    }

    .input-box {
      flex: 1;

      padding: 15px;

      border-radius: 16px;

      border: 1px solid rgba(255,255,255,0.08);

      background: rgba(255,255,255,0.06);

      color: white;

      outline: none;

      font-size: 15px;

      transition: 0.25s;
    }

    .input-box::placeholder {
      color: rgba(226,232,240,0.45);
    }

    .input-box:focus {
      background: rgba(255,255,255,0.09);

      border-color: rgba(96,165,250,0.4);

      box-shadow:
        0 0 0 4px rgba(59,130,246,0.1);
    }

    .btn-send {
      width: 85px;

      border: none;

      border-radius: 16px;

      background: rgba(59,130,246,0.22);

      border: 1px solid rgba(96,165,250,0.28);

      color: white;

      font-weight: bold;

      cursor: pointer;

      transition: 0.25s;
    }

    .btn-send:hover {
      background: rgba(59,130,246,0.34);
    }

    .talk-card {
      width: 100%;

      background: rgba(8,15,28,0.52);

      backdrop-filter: blur(16px);

      border-radius: 24px;

      padding: 20px;

      margin-bottom: 15px;

      border: 1px solid rgba(255,255,255,0.06);

      box-shadow:
        0 8px 24px rgba(0,0,0,0.15);

      position: relative;
    }

    .talk-user {
      font-size: 13px;

      font-weight: bold;

      color: #93c5fd;

      margin-bottom: 10px;

      display: flex;
      align-items: center;
      gap: 5px;
    }

    .talk-content {
      line-height: 1.7;

      color: rgba(241,245,249,0.92);
    }

    .talk-delete {
      position: absolute;

      top: 20px;
      right: 20px;

      color: #f87171;

      cursor: pointer;

      font-size: 11px;

      opacity: 0.7;
    }

    .talk-delete:hover {
      opacity: 1;
    }

    .comment-input-row {
      display: flex;

      gap: 8px;

      margin-top: 18px;

      border-top: 1px solid rgba(255,255,255,0.05);

      padding-top: 15px;
    }

    .comment-input {
      flex: 1;

      padding: 11px 14px;

      border-radius: 12px;

      border: 1px solid rgba(255,255,255,0.05);

      background: rgba(255,255,255,0.05);

      color: white;

      outline: none;
    }

    .comment-input::placeholder {
      color: rgba(226,232,240,0.4);
    }

    .btn-comment {
      padding: 0 16px;

      border: none;

      border-radius: 12px;

      background: rgba(255,255,255,0.08);

      color: white;

      font-size: 12px;
      font-weight: bold;

      cursor: pointer;
    }

    .comment-item {
      background: rgba(255,255,255,0.04);

      padding: 11px 13px;

      border-radius: 12px;

      margin-bottom: 7px;

      font-size: 13px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      color: rgba(241,245,249,0.86);
    }

    .bottom-tab {
      display: none;

      position: fixed;

      bottom: 0;
      left: 0;
      right: 0;

      height: 65px;

      background: rgba(8,15,28,0.92);

      backdrop-filter: blur(18px);

      border-top: 1px solid rgba(255,255,255,0.05);

      justify-content: space-around;
      align-items: center;

      z-index: 999;
    }

    .tab-item {
      display: flex;
      flex-direction: column;

      align-items: center;

      font-size: 11px;

      color: rgba(226,232,240,0.66);

      cursor: pointer;

      flex: 1;

      gap: 4px;
    }

    .tab-item.active {
      color: white;
    }

    .tab-icon {
      font-size: 19px;
    }

    .role-admin {
      color: #f87171;
    }

    .role-teacher {
      color: #facc15;
    }

    .role-student {
      color: #93c5fd;
    }

    @media (max-width: 768px) {

      .sidebar {
        display: none;
      }

      .bottom-tab {
        display: flex;
      }

      .main {
        padding: 18px 14px;
      }

      .talk-card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <header class="header">

    <div class="logo"
      onclick="location.href='main.html'">

      求援<span class="dot">.</span>
    </div>

    <div class="header-right">

      <div class="points" id="hPoints">
        0 기억
      </div>

      <div class="nickname"
        id="hNick"
        onclick="location.href='mypage.html'">

        불러오는 중...
      </div>

      <button class="logout"
        id="logoutBtn">

        열차 탑승
      </button>

    </div>

  </header>

  <div class="layout">

    <aside class="sidebar">

      <div class="menu-item"
        onclick="location.href='qna.html'">

        📖 기록 보관소
      </div>

      <div class="menu-item"
        onclick="location.href='talk.html'">

        🚉 대합실
      </div>

      <div class="menu-item"
        onclick="location.href='point.html'">

        🌙 남겨진 기억
      </div>

      <div class="menu-item"
        onclick="location.href='mypage.html'">

        🎫 승차 기록
      </div>

    </aside>

    <main class="main">

      <div class="station-message"
        id="stationMessage">

      </div>

      <div class="input-row">

        <input
          type="text"
          id="talkInput"
          class="input-box"
          placeholder="오늘 밤은 어떤 생각을 하고 계신가요?">

        <button
          id="talkBtn"
          class="btn-send">

          남기기
        </button>

      </div>

      <div id="talkList"
        style="width:100%;">

      </div>

    </main>

  </div>

  <nav class="bottom-tab">

    <div class="tab-item"
      onclick="location.href='qna.html'">

      <span class="tab-icon">📖</span>
      <span>기록</span>
    </div>

    <div class="tab-item active"
      onclick="location.href='talk.html'">

      <span class="tab-icon">🚉</span>
      <span>대합실</span>
    </div>

    <div class="tab-item"
      onclick="location.href='point.html'">

      <span class="tab-icon">🌙</span>
      <span>기억</span>
    </div>

    <div class="tab-item"
      onclick="location.href='mypage.html'">

      <span class="tab-icon">🎫</span>
      <span>기록</span>
    </div>

  </nav>

</body>

</html>
