<!DOCTYPE html>
<html lang="ko">

<head>
  <link rel="icon" href="./favicon.ico">

  <meta charset="UTF-8">

  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <title>求援 - 승차 확인</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      font-family: 'Pretendard', sans-serif;

      background: #08111f;
    }

    /* 배경 */
    .background {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          rgba(5, 10, 20, 0.5),
          rgba(5, 10, 20, 0.75)
        ),
        url("station.png");

      background-size: cover;
      background-position: center;

      filter:
        brightness(0.75)
        blur(1.5px);

      transform: scale(1.03);
    }

    /* 안개 */
    .fog {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at top,
          rgba(255,255,255,0.05),
          transparent 60%
        );

      pointer-events: none;
    }

    /* 카드 */
    .card {
      position: relative;
      z-index: 10;

      width: calc(100% - 40px);
      max-width: 360px;

      padding: 42px 24px;

      border-radius: 28px;

      background: rgba(10, 18, 35, 0.42);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,0.08);

      box-shadow:
        0 12px 40px rgba(0,0,0,0.4);
    }

    h2 {
      font-size: 28px;
      font-weight: 800;

      color: #f8fafc;

      text-align: center;

      margin-bottom: 10px;
    }

    .sub {
      text-align: center;

      font-size: 13px;
      line-height: 1.7;

      color: rgba(226,232,240,0.68);

      margin-bottom: 28px;
    }

    input {
      width: 100%;

      padding: 15px;

      margin-bottom: 12px;

      border-radius: 14px;

      border: 1px solid rgba(255,255,255,0.08);

      background: rgba(255,255,255,0.05);

      color: white;

      outline: none;

      font-size: 16px;

      transition: 0.25s;
    }

    input::placeholder {
      color: rgba(226,232,240,0.4);
    }

    input:focus {
      border-color: rgba(96,165,250,0.5);

      background: rgba(255,255,255,0.08);

      box-shadow:
        0 0 0 4px rgba(59,130,246,0.12);
    }

    button {
      width: 100%;

      margin-top: 10px;

      padding: 15px;

      border: none;
      border-radius: 14px;

      background: rgba(59,130,246,0.24);

      border: 1px solid rgba(96,165,250,0.28);

      color: #eff6ff;

      font-size: 15px;
      font-weight: 700;

      cursor: pointer;

      transition: 0.25s;
    }

    button:hover {
      transform: translateY(-2px);

      background: rgba(59,130,246,0.34);
    }

    button:active {
      transform: scale(0.98);
    }

    .error {
      min-height: 18px;

      margin-bottom: 6px;

      text-align: center;

      font-size: 13px;

      color: #f87171;
    }

    .link {
      display: block;

      margin-top: 24px;

      text-align: center;

      text-decoration: none;

      font-size: 13px;

      color: rgba(226,232,240,0.6);

      transition: 0.25s;
    }

    .link:hover {
      color: #93c5fd;
    }

    .footer {
      margin-top: 28px;

      text-align: center;

      font-size: 12px;
      line-height: 1.7;

      color: rgba(203,213,225,0.5);
    }

    @media (max-height: 500px) {
      .card {
        padding: 30px 22px;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <div class="fog"></div>

  <div class="card">

    <h2>승차 확인</h2>

    <div class="sub">
      정류장에 남겨진 기록을 확인합니다.
    </div>

    <input
      id="email"
      type="email"
      placeholder="승차권 번호">

    <input
      id="password"
      type="password"
      placeholder="확인 암호">

    <p class="error" id="errorLogin"></p>

    <button id="btnLogin">
      정류장으로 돌아가기
    </button>

    <a href="signup.html" class="link">
      아직 승차권이 없으신가요?
    </a>

    <div class="footer">
      막차는 지났지만,<br>
      아직 몇 개의 불빛은 남아있습니다.
    </div>

  </div>

  <script type="module">
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('btnLogin');

    const handleEnter = (e) => {
      if (e.key === 'Enter') {
        loginBtn.click();
      }
    };

    emailInput.addEventListener('keypress', handleEnter);
    passwordInput.addEventListener('keypress', handleEnter);
  </script>

  <script type="module" src="js/login.js"></script>

</body>

</html>
