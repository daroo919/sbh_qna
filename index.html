<style>
  :root {
    --screen-height: 100svh; 
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Pretendard', -apple-system, sans-serif;
    background: linear-gradient(135deg, #dbeafe, #f0f9ff, #e0f2fe, #c7d2fe);
    background-size: 400% 400%;
    animation: gradientMove 20s ease infinite;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-sizing: border-box;
    position: relative;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* [핵심] 순무 이미지 - 오른쪽 아래 고정 */
  body::after {
    content: "";
    position: fixed;
    bottom: 25px;    /* 바닥에서 띄움 */
    right: 25px;     /* 오른쪽에서 띄움 */
    width: 70px;     /* 순무 크기 (조절 가능) */
    height: 70px;
    background-image: url('./image/순무'); /* 이미지 파일명이 '순무'라면 정확히 입력 */
    background-size: contain;
    background-position: center;
    background-repeat: no-repeat;
    z-index: 100;    /* 어떤 요소보다 위에 오도록 */
    pointer-events: none; /* 클릭 방해 금지 */
    filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); /* 살짝 그림자 추가 */
  }

  .card {
    background: rgba(255, 255, 255, 0.6); 
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 24px;
    padding: 50px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    width: 100%;
    max-width: 360px;
    max-height: 85dvh; 
    box-sizing: border-box;
    transition: transform 0.3s ease;
    position: relative; 
    z-index: 5;
  }

  /* 모바일에서 순무가 너무 크면 아래 값 조절 */
  @media (max-width: 480px) {
    body::after {
      width: 50px;
      height: 50px;
      bottom: 15px;
      right: 15px;
    }
  }
</style>
