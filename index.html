<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>求援</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;

      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;

      width: 100%;
      height: 100vh;
      height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      position: relative;

      background:
        linear-gradient(
          135deg,
          #0f172a 0%,
          #172554 35%,
          #1e293b 70%,
          #312e81 100%
        );

      animation: bgMove 18s ease infinite;
      background-size: 300% 300%;
    }

    @keyframes bgMove {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* 아주 약한 안개 느낌 */
    body::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(circle at top,
          rgba(255, 255, 255, 0.05),
          transparent 60%);

      pointer-events: none;
    }

    /* 필름 느낌 */
    body::after {
      content: "";
      position: absolute;
      inset: 0;

      background: rgba(255, 255, 255, 0.02);

      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 1;

      width: 90%;
      max-width: 360px;

      padding: 48px 28px;

      border-radius: 26px;

      background: rgba(255, 255, 255, 0.08);

      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);

      border: 1px solid rgba(255, 255, 255, 0.12);

      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.35);

      text-align: center;
    }

    h1 {
      margin: 0 0 26px;

      font-size: 42px;
      font-weight: 800;
      letter-spacing: 1px;

      color: #f8fafc;
    }

    .dot {
      color: #60a5fa;

      animation: blink 3s infinite;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .description {
      margin-bottom: 34px;

      font-size: 15px;
      line-height: 1.8;

      color: rgba(226, 232, 240, 0.82);

      word-break: keep-all;
    }

    .description strong {
      color: #ffffff;
      font-weight: 600;
    }

    a {
      display: block;

      margin: 14px 0;
      padding: 14px;

      border-radius: 14px;

      text-decoration: none;

      font-size: 15px;
      font-weight: 700;

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        opacity 0.25s ease;
    }

    a:hover {
      transform: translateY(-2px);
    }

    .btn-login {
      background: rgba(96, 165, 250, 0.18);

      border: 1px solid rgba(96, 165, 250, 0.35);

      color: #eff6ff;
    }

    .btn-login:hover {
      background: rgba(96, 165, 250, 0.28);
    }

    .btn-signup {
      background: rgba(255, 255, 255, 0.08);

      border: 1px solid rgba(255, 255, 255, 0.1);

      color: #f8fafc;
    }

    .btn-signup:hover {
      background: rgba(255, 255, 255, 0.14);
    }

    .footer-text {
      margin-top: 28px;

      font-size: 12px;
      letter-spacing: 0.4px;

      color: rgba(203, 213, 225, 0.58);

      line-height: 1.7;
    }

    /* 모바일 최적화 */
    @media (max-width: 480px) {
      .card {
        padding: 42px 22px;
      }

      h1 {
        font-size: 36px;
      }

      .description {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>求援<span class="dot">.</span></h1>

    <div class="description">
      막차가 지나간 새벽,<br>
      몇 사람은 아직 이 정류장에 머물고 있습니다.
    </div>

    <a href="login.html" class="btn-login">
      승차 확인
    </a>

    <a href="signup.html" class="btn-signup">
      승차권 발급
    </a>

    <div class="footer-text">
      오늘도 조용한 밤이 이어지고 있습니다.
    </div>

  </div>

</body>

</html>
