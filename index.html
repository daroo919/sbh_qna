<style>
  :root {
    /* 최근 브라우저에서 상단 바를 제외한 실제 높이를 계산하는 단위 */
    --screen-height: 100svh; 
  }

  body {
    margin: 0;
    padding: 0;
    font-family: 'Pretendard', -apple-system, sans-serif;
    
    /* [기존 배경 복원] 그라데이션 배경 및 애니메이션 */
    background: linear-gradient(135deg, #dbeafe, #f0f9ff, #e0f2fe, #c7d2fe);
    background-size: 400% 400%;
    animation: gradientMove 20s ease infinite;
    
    /* 핵심: dynamic viewport height를 사용하여 브라우저 바를 제외한 진짜 중앙 계산 */
    height: 100vh; /* 기본 */
    height: 100dvh; /* 최신 브라우저 대응 */
    
    display: flex;
    flex-direction: column; /* 세로 방향 정렬 */
    align-items: center;    /* 가로 중앙 */
    justify-content: center; /* 세로 중앙 */
    
    overflow: hidden; /* 스크롤 절대 방지 */
    box-sizing: border-box;
    position: relative; /* 순무 이미지를 위한 기준점 */
  }

  /* 그라데이션 애니메이션 (기존 코드 복원) */
  @keyframes gradientMove {
    0% {
      background-position: 0% 50%;
    }
    50% {
      background-position: 100% 50%;
    }
    100% {
      background-position: 0% 50%;
    }
  }

  /* [핵심 코드 추가] 순무 이미지를 오른쪽 아래에 작게 고정 */
  body::before {
    content: "";
    position: fixed; /* 화면에 고정 */
    bottom: 20px;    /* 아래에서 20px 띄움 */
    right: 20px;     /* 오른쪽에서 20px 띄움 */
    width: 60px;     /* 가로 크기를 60px로 작게 설정 */
    height: 60px;    /* 세로 크기 */
    
    /* 이미지 경로 설정: 'image' 폴더 안에 'seer.png' */
    background-image: url('image/seer.png'); 
    background-size: contain; /* 이미지가 비율을 유지하며 맞도록 */
    background-position: center; /* 이미지 중앙 기준 */
    background-repeat: no-repeat;
    
    /* 카드가 있을 경우 카드 뒤로 가지 않도록 적절한 z-index 설정 */
    z-index: 10; 
  }

  /* [기존 카드 스타일] */
  .card {
    background: rgba(255, 255, 255, 0.6); 
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px); /* 사파리 대응 */
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 24px;
    padding: 50px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
    
    /* 반응형 너비 설정 */
    width: 100%;
    max-width: 360px; /* 데스크톱 최대 너비 */
    max-height: 85dvh; 
    box-sizing: border-box;
    transition: transform 0.3s ease;
    
    /* 카드가 배경 위로 오도록 */
    position: relative; 
    z-index: 5;
  }

  /* ... 나머지 h1, dot, description, a, btn, media query 등 기존 스타일 동일 ... */

</style>
