<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <title>求援</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100%;
      height: 100vh;
      height: 100dvh;

      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;

      position: relative;

      background: #08111f;
    }

    /* 배경 이미지 */
    .background {
      position: absolute;
      inset: 0;

      background:
        linear-gradient(
          rgba(5, 10, 20, 0.45),
          rgba(5, 10, 20, 0.72)
        ),
        url("station.png");

      background-size: cover;
      background-position: center;

      transform: scale(1.03);

      filter:
        brightness(0.8)
        blur(1.5px);

      animation: bgMove 20s ease-in-out infinite alternate;
    }

    @keyframes bgMove {
      from {
        transform: scale(1.03) translateY(0px);
      }

      to {
        transform: scale(1.06) translateY(-8px);
      }
    }

    /* 어두운 안개 */
    .fog {
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at top,
          rgba(255,255,255,0.05),
          transparent 55%
        );

      pointer-events: none;
    }

    /* 필름 느낌 */
    .noise {
      position: absolute;
      inset: 0;

      background: rgba(255,255,255,0.025);

      pointer-events: none;
    }

    /* 카드 */
    .card {
      position: relative;
      z-index: 10;

      width: 90%;
      max-width: 370px;

      padding: 48px 28px;

      border-radius: 26px;

      background: rgba(10, 18, 35, 0.42);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      border: 1px solid rgba(255,255,255,0.08);

      box-shadow:
        0 10px 40px rgba(0,0,0,0.45);

      text-align: center;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;

      color: #f8fafc;

      margin-bottom: 24px;

      letter-spacing: 1px;
    }

    .dot {
      color: #60a5fa;

      animation: blink 3s infinite;
    }

    @keyframes blink {
      0%,100% {
        opacity: 1;
      }

      50% {
        opacity: 0.35;
      }
    }

    .description {
      font-size: 15px;
      line-height: 1.9;

      color: rgba(226,232,240,0.84);

      margin-bottom: 34px;

      word-break: keep-all;
    }

    .description strong {
      color: white;
      font-weight: 600;
    }

    a {
      display: block;

      text-decoration: none;

      padding: 14px;
      margin: 14px 0;

      border-radius: 14px;

      font-size: 15px;
      font-weight: 700;

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        opacity 0.25s ease;
    }

    a:hover {
      transform: translateY(-2px);
    }

    .btn-login {
      background: rgba(59,130,246,0.22);

      border: 1px solid rgba(96,165,250,0.32);

      color: #eff6ff;
    }

    .btn-login:hover {
      background: rgba(59,130,246,0.35);
    }

    .btn-signup {
      background: rgba(255,255,255,0.06);

      border: 1px solid rgba(255,255,255,0.08);

      color: #f8fafc;
    }

    .btn-signup:hover {
      background: rgba(255,255,255,0.12);
    }

    .footer-text {
      margin-top: 28px;

      font-size: 12px;
      line-height: 1.8;

      color: rgba(203,213,225,0.56);

      letter-spacing: 0.4px;
    }

    /* 하단 시간 */
    .time {
      position: absolute;
      bottom: 26px;
      right: 28px;

      z-index: 5;

      font-size: 12px;
      letter-spacing: 2px;

      color: rgba(255,255,255,0.45);
    }

    /* 모바일 */
    @media (max-width: 480px) {
      .card {
        padding: 42px 22px;
      }

      h1 {
        font-size: 36px;
      }

      .description {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- 배경 -->
  <div class="background"></div>

  <!-- 안개 -->
  <div class="fog"></div>

  <!-- 노이즈 -->
  <div class="noise"></div>

  <!-- 카드 -->
  <div class="card">

    <h1>
      求援<span class="dot">.</span>
    </h1>

    <div class="description">
      막차가 지나간 새벽,<br>
      몇 사람은 아직 이 정류장에 머물고 있습니다.
    </div>

    <a href="login.html" class="btn-login">
      승차 확인
    </a>

    <a href="signup.html" class="btn-signup">
      승차권 발급
    </a>

    <div class="footer-text">
      오늘도 조용한 밤이 이어지고 있습니다.
    </div>

  </div>

  <div class="time">
    01:43 LAST TRAIN
  </div>

</body>

</html>
