<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="./favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>求援 - 힐링 정원</title>
  <style>
    /* --- [1. 원본 스타일 동기화] --- */
    body {
      margin: 0;
      font-family: 'Pretendard', -apple-system, sans-serif;
      background: #1a1a2e; /* 기본 밤하늘 색상 */
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      min-height: 100vh;
      overflow: hidden; /* 정원 페이지는 스크롤 방지 */
    }

    /* 헤더 (원본과 동일) */
    .header {
      height: 70px;
      padding: 0 20px;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4);
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo { font-size: 22px; font-weight: 800; color: #0f172a; cursor: pointer; }
    .dot { color: #2563eb; }
    .header-right { display: flex; align-items: center; gap: 12px; font-size: 13px; }
    .points {
      color: #2563eb; font-weight: 700;
      background: rgba(37, 99, 235, 0.1);
      padding: 4px 10px; border-radius: 20px;
    }
    .nickname { font-weight: 600; color: #334155; cursor: pointer; }

    /* 레이아웃 & 사이드바 (원본과 동일) */
    .layout { display: flex; }
    .sidebar {
      width: 220px;
      padding-top: 20px;
      background: rgba(255, 255, 255, 0.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255, 255, 255, 0.4);
      height: calc(100vh - 70px);
      z-index: 900;
    }
    .menu-item {
      padding: 15px 20px; cursor: pointer; transition: 0.3s;
      color: #374151; font-weight: 500;
    }
    .menu-item:hover { background: rgba(255, 255, 255, 0.6); color: #2563eb; }

    /* 하단 탭 바 (모바일용 원본 동기화) */
    .bottom-tab {
      display: none; position: fixed; bottom: 0; left: 0; right: 0; height: 65px;
      background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px);
      border-top: 1px solid rgba(0, 0, 0, 0.05); justify-content: space-around;
      align-items: center; z-index: 1000; padding-bottom: env(safe-area-inset-bottom);
    }
    .tab-item { display: flex; flex-direction: column; align-items: center; font-size: 11px; color: #64748b; cursor: pointer; flex: 1; gap: 4px; }
    .tab-item.active { color: #2563eb; font-weight: bold; }
    .tab-icon { font-size: 20px; }

    /* --- [2. 정원 전용 에셋 및 애니메이션] --- */
    #garden-main {
      flex: 1; position: relative; height: calc(100vh - 70px);
      display: flex; justify-content: center; align-items: flex-end;
    }

    /* 캐릭터 (seer.png) */
    .character-bench {
      position: absolute; right: 10%; bottom: 15%;
      width: 420px; z-index: 5; pointer-events: none;
      filter: drop-shadow(0 0 15px rgba(0,0,0,0.3));
    }

    /* 잔디 (진짜 풀 느낌) */
    #grass-container {
      width: 100%; height: 180px; z-index: 10;
      display: flex; align-items: flex-end; padding: 0 5px;
    }
    .grass-blade {
      flex: 1; background: #000;
      clip-path: polygon(50% 0%, 42% 25%, 38% 100%, 62% 100%, 58% 25%);
      transform-origin: bottom center;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s;
      animation: wind 4s ease-in-out infinite;
    }
    .grass-blade:hover {
      background: #4f46e5; /* 원본 테마색과 유사한 보라/블루 */
      transform: scaleY(1.2) rotate(10deg);
    }

    @keyframes wind { 0%, 100% { transform: rotate(-1deg); } 50% { transform: rotate(1.5deg); } }

    /* HUD (정원 정보) */
    .garden-hud {
      position: absolute; top: 30px; right: 30px; text-align: right; color: #fff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5); pointer-events: none;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .bottom-tab { display: flex; }
      #garden-main { height: calc(100vh - 135px); }
      .character-bench { width: 280px; right: 5%; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo" onclick="location.href='main.html'">求援<span class="dot">.</span></div>
    <div class="header-right">
      <div class="points" id="hPoints">0P</div>
      <div class="nickname" id="hNick" onclick="location.href='mypage.html'">로딩...</div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="menu-item" onclick="location.href='qna.html'">📄 문답</div>
      <div class="menu-item" onclick="location.href='talk.html'">👤 잡담</div>
      <div class="menu-item" onclick="location.href='point.html'">💰 포인트 관리</div>
      <div class="menu-item" onclick="location.href='mypage.html'">⚙️ 마이페이지</div>
    </aside>

    <main id="garden-main">
      <div class="garden-hud">
        <div style="font-weight: 800; font-size: 20px;">고요한 옥상</div>
        <div id="touchCount" style="font-size: 13px; opacity: 0.8;">보듬어준 횟수: 0</div>
      </div>

      <img src="seer.png" alt="Seer" class="character-bench">

      <div id="grass-container"></div>
    </main>
  </div>

  <nav class="bottom-tab">
    <div class="tab-item" onclick="location.href='qna.html'"><span class="tab-icon">📄</span><span>문답</span></div>
    <div class="tab-item" onclick="location.href='talk.html'"><span class="tab-icon">👤</span><span>잡담</span></div>
    <div class="tab-item" onclick="location.href='point.html'"><span class="tab-icon">💰</span><span>포인트</span></div>
    <div class="tab-item active" onclick="location.href='mypage.html'"><span class="tab-icon">⚙️</span><span>마이</span></div>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    let count = 0;

    onAuthStateChanged(auth, async u => {
      if (!u) return location.href = "login.html";
      
      const s = await getDoc(doc(db, "users", u.uid));
      if (s.exists()) {
        const user = s.data();
        // 헤더 동기화
        const rName = user.role === "admin" ? "관리자" : (user.role === "teacher" ? "선생님" : "학생");
        document.getElementById("hNick").innerText = `[${rName}] ${user.nickname}`;
        document.getElementById("hPoints").innerText = (user.points || 0) + "P";

        // 사용자 배경 이미지 로드 (투명도 조절로 정원 분위기 유지)
        const localBg = localStorage.getItem(`bg_${u.uid}`);
        if (localBg) {
          document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('${localBg}')`;
        }
      }
    });

    // 잔디 생성 (원본 스케치 느낌 반영)
    const container = document.getElementById('grass-container');
    const bladeCount = 50;

    for (let i = 0; i < bladeCount; i++) {
      const b = document.createElement('div');
      b.className = 'grass-blade';
      b.style.height = (Math.random() * 60 + 100) + 'px';
      b.style.animationDelay = (Math.random() * 2) + 's';
      
      b.addEventListener('mouseenter', () => {
        count++;
        document.getElementById('touchCount').innerText = `보듬어준 횟수: ${count}`;
      });
      container.appendChild(b);
    }
  </script>
</body>
</html>
