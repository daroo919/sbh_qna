<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>EntryJS 테스트</title>

  <!-- 필수 CSS -->
  <link rel="stylesheet" href="https://playentry.org/lib/entry-js/dist/entry.css">

  <!-- 필수 라이브러리 (최소 세트) -->
  <script src="https://code.jquery.com/jquery-1.12.4.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>

  <!-- EntryJS -->
  <script src="https://playentry.org/lib/entry-js/dist/entry.min.js"></script>
</head>

<body>
  <!-- 엔트리 들어갈 자리 -->
  <div id="workspace" style="width:100%; height:600px;"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const workspace = document.getElementById("workspace");

      Entry.init(workspace, {
        type: "workspace"
      });

      Entry.loadProject();
    });
  </script>
</body>
</html>
