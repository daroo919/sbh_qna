<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="icon" href="./favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>求援 - 물리 힐링 정원</title>
  <style>
    /* [1. 원본 디자인 동기화] */
    body {
      margin: 0; font-family: 'Pretendard', sans-serif;
      background: #0f172a; overflow: hidden;
    }
    .header {
      height: 70px; padding: 0 20px; background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4); position: sticky; top: 0; z-index: 1000;
    }
    .logo { font-size: 22px; font-weight: 800; color: #0f172a; cursor: pointer; }
    .dot { color: #2563eb; }
    .header-right { display: flex; align-items: center; gap: 12px; font-size: 13px; }
    .points { color: #2563eb; font-weight: 700; background: rgba(37, 99, 235, 0.1); padding: 4px 10px; border-radius: 20px; }

    .layout { display: flex; }
    .sidebar {
      width: 220px; background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255, 255, 255, 0.4); height: calc(100vh - 70px);
    }
    .menu-item { padding: 15px 20px; cursor: pointer; transition: 0.3s; color: #374151; font-weight: 500; }
    .menu-item:hover { background: rgba(255, 255, 255, 0.6); color: #2563eb; }

    /* [2. 정원 & 물리 캔버스 레이아웃] */
    #garden-main {
      flex: 1; position: relative; height: calc(100vh - 70px);
      background: linear-gradient(to bottom, #1e1e3f, #0b0b1a);
    }
    #physics-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5;
    }
    .character-bench {
      position: absolute; right: 5%; bottom: 12%; width: 450px; z-index: 2; pointer-events: none;
    }
    .garden-hud {
      position: absolute; top: 30px; right: 30px; text-align: right; color: #fff; z-index: 20; pointer-events: none;
    }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      #garden-main { height: calc(100vh - 135px); }
      .character-bench { width: 300px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo" onclick="location.href='main.html'">求援<span class="dot">.</span></div>
    <div class="header-right">
      <div class="points" id="hPoints">0P</div>
      <div id="hNick" class="nickname" onclick="location.href='mypage.html'">로딩 중...</div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="menu-item" onclick="location.href='qna.html'">📄 문답</div>
      <div class="menu-item" onclick="location.href='talk.html'">👤 잡담</div>
      <div class="menu-item" onclick="location.href='point.html'">💰 포인트 관리</div>
      <div class="menu-item" onclick="location.href='mypage.html'">⚙️ 마이페이지</div>
    </aside>

    <main id="garden-main">
      <div class="garden-hud">
        <div style="font-weight: 800; font-size: 20px;">고요한 옥상</div>
        <div id="touchCount" style="font-size: 13px; opacity: 0.8;">보듬어준 횟수: 0</div>
      </div>
      <img src="seer.png" alt="Seer" class="character-bench">
      <canvas id="physics-canvas"></canvas>
    </main>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    // --- [사용자 데이터 로드] ---
    onAuthStateChanged(auth, async u => {
      if (!u) return;
      const s = await getDoc(doc(db, "users", u.uid));
      if (s.exists()) {
        const d = s.data();
        document.getElementById("hNick").innerText = d.nickname;
        document.getElementById("hPoints").innerText = (d.points || 0) + "P";
        const bg = localStorage.getItem(`bg_${u.uid}`);
        if (bg) document.getElementById("garden-main").style.backgroundImage = `linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('${bg}')`;
      }
    });

    // --- [가성비 물리 엔진 로직] ---
    const canvas = document.getElementById('physics-canvas');
    const ctx = canvas.getContext('2d');
    let width, height;
    let count = 0;

    const mouse = { x: -1000, y: -1000, vx: 0, vy: 0 };
    const blades = [];
    const bladeCount = 120; // 잔디 밀도

    class Blade {
      constructor(x) {
        this.x = x;
        this.baseY = height;
        this.h = Math.random() * 60 + 80;
        this.angle = 0; // 현재 휘어진 각도
        this.targetAngle = 0; // 목표 각도
        this.stiffness = 0.1 + Math.random() * 0.1; // 복원력
      }

      update() {
        const dist = Math.hypot(mouse.x - this.x, mouse.y - (this.baseY - this.h/2));
        if (dist < 100) {
          // 마우스와의 거리와 속도에 따라 휘어짐 계산
          const force = (100 - dist) / 100;
          const dir = mouse.x > this.x ? -1 : 1;
          this.targetAngle = dir * force * (Math.abs(mouse.vx) + 1.5);
          count += 0.1; // 조금씩 카운트 증가
          document.getElementById('touchCount').innerText = `보듬어준 횟수: ${Math.floor(count)}`;
        } else {
          this.targetAngle = 0;
        }
        // 부드러운 복원력 (물리 공식 대용)
        this.angle += (this.targetAngle - this.angle) * this.stiffness;
      }

      draw() {
        const tipX = this.x + Math.sin(this.angle) * this.h;
        const tipY = this.baseY - Math.cos(this.angle) * this.h;

        ctx.beginPath();
        ctx.moveTo(this.x, this.baseY);
        // 베지어 곡선으로 진짜 풀처럼 휘어지게 그림
        ctx.quadraticCurveTo(this.x, this.baseY - this.h / 2, tipX, tipY);
        ctx.strokeStyle = '#000'; // 검은 실루엣
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }

    function init() {
      width = canvas.width = canvas.clientWidth;
      height = canvas.height = canvas.clientHeight;
      blades.length = 0;
      for (let i = 0; i < width; i += width / bladeCount) {
        blades.push(new Blade(i));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      blades.forEach(b => {
        b.update();
        b.draw();
      });
      requestAnimationFrame(animate);
    }

    window.addEventListener('resize', init);
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const newX = e.clientX - rect.left;
      const newY = e.clientY - rect.top;
      mouse.vx = newX - mouse.x;
      mouse.x = newX;
      mouse.y = newY;
    });

    init();
    animate();
  </script>
</body>
</html>
