<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>求援 - 마이페이지 (ASMR)</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* 기본 레이아웃 및 애니메이션 */
    body { margin: 0; font-family: 'Pretendard', sans-serif; background: #f0f9ff; overflow: hidden; min-height: 100vh; background-size: cover; background-position: center; transition: background-image 0.5s ease; }
    .header { height: 70px; padding: 0 20px; background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(12px); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.4); position: sticky; top: 0; z-index: 1000; }
    .logo { font-size: 22px; font-weight: 800; color: #0f172a; cursor: pointer; }
    .dot { color: #2563eb; }
    .header-right { display: flex; align-items: center; gap: 12px; font-size: 13px; }
    .points { color: #2563eb; font-weight: 700; background: rgba(37, 99, 235, 0.1); padding: 4px 10px; border-radius: 20px; }
    .logout { cursor: pointer; padding: 6px 12px; border-radius: 10px; background: rgba(239, 68, 68, 0.1); color: #ef4444; font-weight: bold; font-size: 12px; }

    .layout { display: flex; height: calc(100vh - 70px); position: relative; }
    .sidebar { width: 220px; padding-top: 20px; background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(12px); border-right: 1px solid rgba(255, 255, 255, 0.4); z-index: 900; }
    .menu-item { padding: 15px 20px; cursor: pointer; transition: 0.3s; color: #374151; font-weight: 500; display: flex; align-items: center; gap: 10px; }
    .menu-item:hover { background: rgba(255, 255, 255, 0.6); color: #2563eb; }
    .menu-item.active { color: #2563eb; font-weight: bold; }
    .menu-icon { font-size: 16px; }

    .main { flex: 1; position: relative; z-index: 10; padding: 0; } /* 패딩 제거 */

    /* [수정 2] 나가기 버튼: 캐릭터 머리띠 근처로 이동 (Main 영역 내부 좌측 상단) */
    .exit-btn {
      position: absolute; top: 20px; left: 20px; 
      padding: 8px 16px; border-radius: 12px; border: none;
      background: rgba(15, 23, 42, 0.7); color: white; 
      font-weight: bold; cursor: pointer; font-size: 13px;
      backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
      transition: 0.2s; z-index: 1000; /* 헤더와 같은 z-index */
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .exit-btn:hover { background: rgba(15, 23, 42, 1); transform: scale(1.05); }

    /* 잔디 컨테이너 */
    #garden-container { position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 1; pointer-events: none; }
    /* [수정 1] 마우스 포인터 유지 (cursor: none 제거) */
    canvas#grassCanvas { width: 100%; height: 100%; pointer-events: auto; display: block; } 
    
    /* HUD (보듬은 횟수) */
    .hud { 
      position: absolute; top: 20px; right: 20px; background: white; 
      padding: 15px 25px; border-radius: 15px; z-index: 900; 
      text-align: center; border: 1px solid #e2e8f0; 
      box-shadow: 0 8px 20px rgba(0,0,0,0.05); 
    }
    .hud-label { font-size: 11px; color: #64748b; margin-bottom: 5px; font-weight: 600; }
    #count { font-size: 32px; font-weight: 900; color: #2563eb; line-height: 1; }

    @media (max-width: 768px) { .sidebar { display: none; } #garden-container { left: 0; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo" onclick="location.href='main.html'">求援<span class="dot">.</span></div>
    <div class="header-right">
      <div class="points" id="hPoints">0P</div>
      <div class="nickname" id="hNick">로딩...</div>
      <div class="logout" id="logoutBtn">로그아웃</div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="menu-item" onclick="location.href='qna.html'"><span class="menu-icon">📄</span>문답</div>
      <div class="menu-item" onclick="location.href='talk.html'"><span class="menu-icon">👤</span>잡담</div>
      <div class="menu-item" onclick="location.href='point.html'"><span class="menu-icon">💰</span>포인트 관리</div>
      <div class="menu-item active"><span class="menu-icon">⚙️</span>마이페이지</div>
    </aside>

    <main class="main">
      <button class="exit-btn" onclick="location.href='main.html'">나가기</button>

      <div id="garden-container">
        <div class="hud">
          <div class="hud-label">보듬어준 횟수</div>
          <div id="count">0</div>
        </div>
        <canvas id="grassCanvas"></canvas>
      </div>
    </main>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.href = "login.html";
      
      const applyBg = (uid) => {
        const bg = localStorage.getItem(`bg_${uid}`);
        if (bg) document.body.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.4)), url('${bg}')`;
      };
      applyBg(user.uid);

      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) {
        const d = snap.data();
        document.getElementById('hNick').innerText = d.nickname;
        document.getElementById('hPoints').innerText = (d.points || 0) + "P";
      }
    });

    // --- [사운드 시스템 및 잔디 엔진 로직은 이전과 동일 (생략)] ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const soundBuffers = [];
    const effectFiles = [
      'dragon-studio-grass-rustling-04-504019.mp3',
      'dragon-studio-grass-rustling-04-511301.mp3',
      'dragon-studio-grass-rustling-05-511299.mp3',
      'dragon-studio-dry-grass-rustling-478361.mp3'
    ];

    async function loadSounds() {
      if (soundBuffers.length > 0) return;
      for (const url of effectFiles) {
        const response = await fetch(url);
        const arrayBuffer = await response.arrayBuffer();
        const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);
        soundBuffers.push(audioBuffer);
      }
    }
    setTimeout(loadSounds, 1000);

    function playGrassSound(volume) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      if (soundBuffers.length === 0) return;
      const source = audioCtx.createBufferSource();
      source.buffer = soundBuffers[Math.floor(Math.random() * soundBuffers.length)];
      const gainNode = audioCtx.createGain();
      gainNode.gain.value = volume;
      source.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      source.start(0);
    }

    let bgm = new Audio('dragon-studio-dry-field-grass-rustling-482893.mp3');
    bgm.loop = true; bgm.volume = 0.15;
    let isBgmStarted = false;

    const canvas = document.getElementById('grassCanvas'), ctx = canvas.getContext('2d');
    let width, height;
    const mouse = { x: -1000, vx: 0 }, blades = [];
    let lastX = 0, isMoving = false, touches = 0, timer;

    class Blade {
      constructor(x) { 
        this.x = x; this.h = 180 + Math.random() * 220; 
        this.angle = 0; this.targetAngle = 0; 
        this.stiffness = 0.08 + Math.random() * 0.1; 
        this.color = `rgba(187, 247, 208, ${0.4 + Math.random() * 0.5})`;
      }
      update() {
        const dist = Math.abs(mouse.x - this.x);
        if(isMoving && dist < 140) {
          this.targetAngle = mouse.vx * 0.25;
          if(Math.random() > 0.95) playGrassSound(Math.min(0.2, Math.abs(mouse.vx)/180));
          touches += 0.002; document.getElementById('count').innerText = Math.floor(touches);
        } else { this.targetAngle = 0; }
        this.angle += (this.targetAngle - this.angle) * this.stiffness;
      }
      draw() {
        ctx.beginPath(); ctx.moveTo(this.x, height);
        const tipX = this.x + Math.sin(this.angle) * this.h;
        const tipY = height - Math.cos(this.angle) * this.h;
        ctx.quadraticCurveTo(this.x, height - this.h / 2, tipX, tipY);
        ctx.strokeStyle = this.color; ctx.lineWidth = 12; ctx.lineCap = 'round'; ctx.stroke();
      }
    }

    function init() {
      width = canvas.width = canvas.offsetWidth; height = canvas.height = canvas.offsetHeight;
      blades.length = 0;
      for(let i=0; i<=width; i+=8) blades.push(new Blade(i + Math.random() * 8));
    }
    function animate() { ctx.clearRect(0, 0, width, height); blades.forEach(b => { b.update(); b.draw(); }); requestAnimationFrame(animate); }

    window.addEventListener('mousemove', (e) => {
      if(!isBgmStarted) { bgm.play().catch(()=>{}); isBgmStarted = true; loadSounds(); }
      isMoving = true;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      mouse.vx = x - lastX; mouse.x = x; lastX = x;
      clearTimeout(timer); timer = setTimeout(() => isMoving = false, 50);
    });

    window.addEventListener('resize', init);
    document.getElementById("logoutBtn").onclick = () => { if(confirm("로그아웃 하시겠습니까?")) signOut(auth).then(()=>location.href="login.html"); };
    init(); animate();
  </script>
</body>
</html>
