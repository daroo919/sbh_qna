<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>求援 - 딥 힐링 정원</title>
    <script src="myr.js"></script>
    <script src="convTex.js"></script>
    <script src="cubicNoise.js"></script>
    <style>
        /* [1. 기존 UI 스타일 유지] */
        body {
            margin: 0; font-family: 'Pretendard', sans-serif;
            background: #1a1a2e; overflow: hidden;
        }
        .header {
            height: 70px; background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.4);
            position: sticky; top: 0; z-index: 1000;
        }
        .logo { font-size: 22px; font-weight: 800; color: #0f172a; cursor: pointer; }
        .dot { color: #2563eb; }
        .sidebar {
            width: 220px; background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px); border-right: 1px solid rgba(255, 255, 255, 0.4);
            height: calc(100vh - 70px); position: absolute; left: 0; z-index: 900;
        }
        .menu-item { padding: 15px 20px; cursor: pointer; color: #374151; font-weight: 500; }
        
        /* [2. 렌더러(잔디밭) 레이아웃] */
        #garden-container {
            margin-left: 220px; width: calc(100vw - 220px); height: calc(100vh - 70px);
            position: relative; background: #000;
        }
        canvas#renderer {
            width: 100%; height: 100%; display: block;
        }
        
        /* 캐릭터 (seer.png) - 캔버스 위에 띄움 */
        .character-bench {
            position: absolute; right: 5%; bottom: 10%;
            width: 400px; z-index: 10; pointer-events: none;
        }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            #garden-container { margin-left: 0; width: 100vw; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="logo" onclick="location.href='main.html'">求援<span class="dot">.</span></div>
        <div id="hNick" style="font-size:13px; font-weight:600; color:#334155;">로딩...</div>
    </header>

    <div style="display: flex;">
        <aside class="sidebar">
            <div class="menu-item" onclick="location.href='qna.html'">📄 문답</div>
            <div class="menu-item" onclick="location.href='talk.html'">👤 잡담</div>
            <div class="menu-item" onclick="location.href='point.html'">💰 포인트 관리</div>
            <div class="menu-item" onclick="location.href='mypage.html'">⚙️ 마이페이지</div>
        </aside>

        <main id="garden-container">
            <img src="seer.png" class="character-bench">
            <canvas id="renderer"></canvas>
        </main>
    </div>

        const bladeColor = new Myr.Color(0.1, 0.1, 0.2); 
        const bladeBaseColor = new Myr.Color(0, 0, 0);

        const myr = new Myr(canvas);
        const rect = canvas.getBoundingClientRect();

</body>
</html>
