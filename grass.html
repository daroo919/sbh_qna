<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>求援 - 마이페이지 (ASMR)</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { margin: 0; font-family: 'Pretendard', sans-serif; background: #f0f9ff; overflow: hidden; min-height: 100vh; background-size: cover; background-position: center; }
    .layout { display: flex; height: calc(100vh - 70px); }
    .main { flex: 1; position: relative; z-index: 10; padding: 20px; overflow-y: auto; }
    
    /* 프로필 카드 디자인 */
    .profile-card {
      background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border-radius: 20px; padding: 30px; border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(31, 38, 135, 0.05); max-width: 450px; margin: 40px auto;
    }
    .field { margin-bottom: 20px; }
    .label { font-size: 14px; color: #64748b; margin-bottom: 8px; font-weight: 600; }
    .input-box, .upload-box {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.5); box-sizing: border-box; font-size: 15px;
    }
    .save-btn { width: 100%; padding: 14px; border-radius: 16px; border: none; background: #0f172a; color: white; font-weight: bold; cursor: pointer; }

    /* 잔디 컨테이너 */
    #garden-container { position: fixed; top: 70px; left: 220px; right: 0; bottom: 0; z-index: 1; pointer-events: none; }
    canvas#grassCanvas { width: 100%; height: 100%; pointer-events: auto; }
    .hud { position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.8); padding: 10px 20px; border-radius: 15px; z-index: 100; text-align: center; }

    @media (max-width: 768px) { .sidebar { display: none; } #garden-container { left: 0; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="logo" onclick="location.href='main.html'">求援<span class="dot">.</span></div>
    <div class="header-right">
      <div class="points" id="hPoints">0P</div>
      <div class="nickname" id="hNick">로딩 중...</div>
      <div class="logout" id="logoutBtn">로그아웃</div>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="menu-item" onclick="location.href='qna.html'">📄 문답</div>
      <div class="menu-item" onclick="location.href='talk.html'">👤 잡담</div>
      <div class="menu-item" onclick="location.href='point.html'">💰 포인트 관리</div>
      <div class="menu-item active">⚙️ 마이페이지</div>
    </aside>

    <main class="main">
      <div class="profile-card">
        <h2 style="margin:0 0 20px 0; color:#0f172a;">내 프로필 설정</h2>
        <div class="field">
          <div class="label">닉네임 변경</div>
          <input type="text" id="nickInput" class="input-box" placeholder="닉네임 입력">
        </div>
        <div class="field">
          <div class="label">배경 이미지 설정</div>
          <div class="upload-box" onclick="document.getElementById('fileInput').click()" style="cursor:pointer; text-align:center;">
            <span id="fileName">🖼️ 사진 선택</span>
            <input type="file" id="fileInput" accept="image/*" style="display:none">
          </div>
        </div>
        <button id="saveBtn" class="save-btn">변경사항 저장하기</button>
      </div>

      <div id="garden-container">
        <div class="hud">
          <div style="font-size: 11px; color: #64748b;">보듬어준 횟수</div>
          <div id="count" style="font-size: 20px; font-weight: 900; color: #2563eb;">0</div>
        </div>
        <canvas id="grassCanvas"></canvas>
      </div>
    </main>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    // --- 배경화면 로드 함수 ---
    function loadBackground(uid) {
      const bg = localStorage.getItem(`bg_${uid}`);
      if (bg) document.body.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.4), rgba(255,255,255,0.4)), url('${bg}')`;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) return location.href = "login.html";
      loadBackground(user.uid);
      const snap = await getDoc(doc(db, "users", user.uid));
      if (snap.exists()) {
        const d = snap.data();
        document.getElementById('hNick').innerText = d.nickname;
        document.getElementById('hPoints').innerText = (d.points || 0) + "P";
        document.getElementById('nickInput').value = d.nickname;
      }
    });

    // --- 파일 업로드 로직 ---
    document.getElementById('fileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const base64 = ev.target.result;
          localStorage.setItem(`bg_${auth.currentUser.uid}`, base64);
          loadBackground(auth.currentUser.uid);
          document.getElementById('fileName').innerText = "✅ 변경 완료!";
        };
        reader.readAsDataURL(file);
      }
    };

    // --- 잔디 및 ASMR 엔진 (빳빳한 물리 버전) ---
    const canvas = document.getElementById('grassCanvas'), ctx = canvas.getContext('2d');
    let width, height, audioCtx, bgm, isBgm = false;
    const effectFiles = ['dragon-studio-grass-rustling-04-504019.mp3','dragon-studio-grass-rustling-04-511301.mp3','dragon-studio-grass-rustling-05-511299.mp3','dragon-studio-dry-grass-rustling-478361.mp3'];
    const effects = effectFiles.map(f => new Audio(f));

    function startAudio() {
      if(!isBgm) {
        bgm = new Audio('dragon-studio-dry-field-grass-rustling-482893.mp3');
        bgm.loop = true; bgm.volume = 0.15; bgm.play(); isBgm = true;
      }
    }

    const mouse = { x: -1000, vx: 0 }, blades = [];
    let lastX = 0, isMoving = false, touches = 0, timer;

    class Blade {
      constructor(x) { this.x = x; this.h = 110 + Math.random()*70; this.angle = 0; this.vx = 0; this.stiffness = 0.7; this.damping = 0.8; this.color = `rgba(187, 247, 208, ${0.7+Math.random()*0.3})`; }
      update() {
        const tx = this.x + Math.sin(this.angle)*this.h, dist = Math.abs(mouse.x - tx);
        if(isMoving && dist < 100) {
          this.targetAngle = mouse.vx * 0.4;
          if(Math.random() > 0.97) {
            const s = effects[Math.floor(Math.random()*effects.length)].cloneNode();
            s.volume = Math.min(0.4, Math.abs(mouse.vx)/100); s.play();
          }
          touches += 0.002; document.getElementById('count').innerText = Math.floor(touches);
        } else { this.targetAngle = 0; }
        this.vx += (this.targetAngle - this.angle) * this.stiffness;
        this.vx *= this.damping; this.angle += this.vx;
      }
      draw() {
        ctx.beginPath(); ctx.moveTo(this.x, height);
        ctx.quadraticCurveTo(this.x, height-this.h/2, this.x+Math.sin(this.angle)*this.h, height-this.h);
        ctx.strokeStyle = this.color; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.stroke();
      }
    }

    function init() {
      width = canvas.width = canvas.offsetWidth; height = canvas.height = canvas.offsetHeight;
      blades.length = 0; for(let i=0; i<=width; i+=12) blades.push(new Blade(i+Math.random()*10));
    }
    function animate() { ctx.clearRect(0,0,width,height); blades.forEach(b => { b.update(); b.draw(); }); requestAnimationFrame(animate); }
    window.addEventListener('mousemove', (e) => {
      startAudio(); isMoving = true; const x = e.clientX - canvas.getBoundingClientRect().left;
      mouse.vx = x - lastX; mouse.x = x; lastX = x;
      clearTimeout(timer); timer = setTimeout(() => isMoving = false, 50);
    });
    window.onresize = init; init(); animate();
  </script>
</body>
</html>
