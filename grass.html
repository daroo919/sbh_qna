<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>求援 - 힐링 정원</title>
  <style>
    body { margin: 0; font-family: 'Pretendard', sans-serif; background: #f0f9ff; overflow: hidden; }
    
    /* 기존 레이아웃 유지 */
    .header {
      height: 70px; padding: 0 20px; background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(12px); display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.4); position: sticky; top: 0; z-index: 1000;
    }
    .logo { font-size: 22px; font-weight: 800; color: #0f172a; cursor: pointer; }
    .dot { color: #2563eb; }

    .layout { display: flex; }
    .sidebar {
      width: 220px; background: rgba(255, 255, 255, 0.5); backdrop-filter: blur(12px);
      border-right: 1px solid rgba(255, 255, 255, 0.4); height: calc(100vh - 70px);
    }
    .menu-item { padding: 15px 20px; color: #374151; font-weight: 500; cursor: pointer; }

    /* 잔디 구역 */
    #garden-main { flex: 1; position: relative; height: calc(100vh - 70px); overflow: hidden; }
    canvas { position: absolute; bottom: 0; left: 0; width: 100%; height: 100%; }

    /* 카운터 */
    .hud {
      position: absolute; top: 20px; right: 20px; background: rgba(255, 255, 255, 0.8);
      padding: 10px 20px; border-radius: 15px; border: 1px solid #e2e8f0; z-index: 100;
    }
    #count { font-size: 20px; font-weight: 900; color: #2563eb; }

    @media (max-width: 768px) { .sidebar { display: none; } }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo">求援<span class="dot">.</span></div>
    <div style="font-size: 13px; color: #64748b;">Healing Garden</div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="menu-item">📄 문답</div>
      <div class="menu-item">👤 잡담</div>
      <div class="menu-item">⚙️ 마이페이지</div>
    </aside>

    <main id="garden-main">
      <div class="hud">
        <div style="font-size: 11px; color: #64748b;">쓰다듬은 횟수</div>
        <div id="count">0</div>
      </div>
      <canvas id="grassCanvas"></canvas>
    </main>
  </div>

  <script>
    const canvas = document.getElementById('grassCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    const mouse = { x: -1000, y: -1000, vx: 0 };
    let lastX = 0;
    let isMoving = false;
    let timer;
    let touches = 0;

    const blades = [];
    const bladeCount = 400; // 보내주신 이미지처럼 무성하게 표현하기 위해 개수 대폭 증가

    class Blade {
      constructor(x) {
        this.x = x;
        // 이미지처럼 높이를 다양하게 설정
        this.h = 120 + Math.random() * 100; 
        this.angle = 0;
        this.targetAngle = 0;
        this.stiffness = 0.05 + Math.random() * 0.1;
        // 보내주신 이미지의 연한 초록색 반영
        this.color = `rgba(187, 247, 208, ${0.7 + Math.random() * 0.3})`; 
      }

      update() {
        const dist = Math.abs(mouse.x - this.x);
        // 마우스가 움직일 때만 반응
        if (isMoving && dist < 100) {
          const force = (100 - dist) / 100;
          this.targetAngle = (mouse.vx * force * 0.6);
          touches += 0.002;
          document.getElementById('count').innerText = Math.floor(touches);
        } else {
          this.targetAngle = 0;
        }
        this.angle += (this.targetAngle - this.angle) * this.stiffness;
      }

      draw() {
        ctx.beginPath();
        ctx.moveTo(this.x, height);
        // 무성한 느낌을 위해 곡선으로 그림
        const tipX = this.x + (this.angle * this.h * 0.8);
        const tipY = height - this.h + Math.abs(this.angle * 20);
        ctx.quadraticCurveTo(this.x, height - this.h / 2, tipX, tipY);
        ctx.strokeStyle = this.color;
        ctx.lineWidth = 8; // 이미지처럼 두툼한 질감
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }

    function init() {
      width = canvas.width = canvas.offsetWidth;
      height = canvas.height = canvas.offsetHeight;
      blades.length = 0;
      // 화면 가로를 꽉 채우도록 잔디 생성
      for (let i = 0; i < width; i += width / bladeCount) {
        blades.push(new Blade(i + (Math.random() * 10 - 5)));
      }
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);
      blades.forEach(b => {
        b.update();
        b.draw();
      });
      requestAnimationFrame(animate);
    }

    window.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const currX = e.clientX - rect.left;
      isMoving = true;
      mouse.vx = currX - lastX;
      mouse.x = currX;
      lastX = currX;

      clearTimeout(timer);
      timer = setTimeout(() => { isMoving = false; mouse.vx = 0; }, 50);
    });

    window.addEventListener('resize', init);
    init();
    animate();
  </script>
</body>
</html>
