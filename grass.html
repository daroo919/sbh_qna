<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>求援 - 힐링 정원 (ASMR)</title>
    <style>
        :root {
            --sky-top: #87CEEB;
            --sky-bottom: #f0f9ff;
            --ground-light: #a7d08c;
            --ground-dark: #8eb36d;
            --wood-brown: #6d4c41;
            --leaf-green: #4caf50;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.3);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: 'Apple SD Gothic Neo', sans-serif;
            background-color: var(--sky-bottom);
        }

        /* --- [배경: 정원 레이아웃] --- */
        #garden {
            width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, var(--sky-top) 0%, var(--sky-bottom) 50%, var(--ground-light) 50%, var(--ground-dark) 100%);
            position: relative; cursor: pointer;
        }

        /* --- [상단 상호작용 패널] --- */
        .interaction-panel {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; display: flex; flex-direction: column; align-items: center; gap: 10px;
            background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            padding: 15px 25px; border-radius: 20px; border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.05);
        }
        .garden-title { font-weight: 800; font-size: 18px; color: #334155; margin: 0; }
        .stats { font-size: 14px; color: #475569; display: flex; gap: 15px; }
        .back-btn {
            background: rgba(15, 23, 42, 0.8); color: white; border: none; padding: 8px 16px;
            border-radius: 10px; cursor: pointer; font-size: 13px; font-weight: 600;
            transition: 0.2s;
        }
        .back-btn:hover { background: #0f172a; transform: translateY(-1px); }

        /* --- [ASMR 잔디 요소 (만지는 느낌)] --- */
        .grass-blade {
            position: absolute; bottom: 0; width: 10px; height: 60px;
            background: linear-gradient(to top, var(--ground-dark), var(--ground-light));
            border-radius: 5px 5px 0 0; transform-origin: bottom;
            transition: transform 0.1s ease-out; z-index: 10;
        }
        /* 마우스가 지나갈 때 (만질 때) 옆으로 눕는 효과 */
        .grass-blade:hover { transform: rotate(30deg) scaleY(0.8); }

        /* --- [나무 성장 시스템] --- */
        #the-tree {
            position: absolute; bottom: 50%; left: 50%; transform: translate(-50%, 0%);
            z-index: 5; transition: all 1s ease-in-out;
            display: flex; flex-direction: column; align-items: center;
        }
        /* 나무 기둥 */
        .trunk {
            width: 20px; height: 0px; /* 초기 높이 0 */
            background-color: var(--wood-brown);
            border-radius: 5px 5px 0 0;
            transition: height 1s ease-in-out;
        }
        /* 나뭇잎 (원형 에셋) */
        .leaves-cluster {
            position: absolute; top: 0; transform: translateY(-50%);
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 5px;
            opacity: 0; transition: opacity 1s ease-in-out;
        }
        .leaf {
            width: 40px; height: 40px; background-color: var(--leaf-green);
            border-radius: 50%; opacity: 0.8;
            animation: rustle 4s ease-in-out infinite;
        }
        .leaf:nth-child(2) { animation-delay: 1s; }
        .leaf:nth-child(3) { animation-delay: 2s; }
        .leaf:nth-child(4) { animation-delay: 3s; }

        @keyframes rustle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05) translate(2px, -2px); } }

        /* --- [애니메이션 에셋 (꽃/새싹)] --- */
        .plant { position: absolute; transform: translate(-50%, -100%); z-index: 12; pointer-events: none; }
        .pop-effect { font-size: 32px; animation: pop-appear 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop-appear { 0% { transform: translate(-50%, -100%) scale(0); opacity: 0; } 80% { transform: translate(-50%, -100%) scale(1.2); opacity: 1; } 100% { transform: translate(-50%, -100%) scale(1); } }

        /* --- [안내 메시지] --- */
        #guide-msg {
            position: fixed; bottom: 100px; width: 100%; text-align: center;
            color: #555; font-size: 15px; z-index: 100; pointer-events: none;
            text-shadow: 1px 1px 2px white; animation: fade-out 5s forwards; animation-delay: 3s;
        }
        @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
    </style>
</head>
<body>

    <div id="garden">
        <div class="interaction-panel" onclick="event.stopPropagation();">
            <h1 class="garden-title">求援 힐링 정원</h1>
            <div class="stats">
                <span id="stat-touch">만짐: 0</span>
                <span id="stat-level">나무 레벨: 1</span>
            </div>
            <button class="back-btn" onclick="location.href='mypage.html'">마이페이지로 돌아가기</button>
        </div>

        <div id="the-tree">
            <div class="leaves-cluster" id="tree-leaves">
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
                <div class="leaf"></div>
            </div>
            <div class="trunk" id="tree-trunk"></div>
        </div>

        <div id="grass-area"></div>
        
        <p id="guide-msg">잔디를 마우스로 부드럽게 문질러보세요 (ASMR).<br>많이 만질수록 중앙의 나무가 자라납니다.</p>
    </div>

    <script>
        const garden = document.getElementById('garden');
        const trunk = document.getElementById('tree-trunk');
        const leaves = document.getElementById('tree-leaves');
        const touchStat = document.getElementById('stat-touch');
        const levelStat = document.getElementById('stat-level');

        let touchCount = 0;
        let treeLevel = 1;
        
        // 브라우저 기본 사운드를 활용한 ASMR (초기 클릭 필요)
        let audioCtx = null;
        function playRustleSound() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            // 바람소리와 유사한 노이즈 레시피
            osc.type = 'triangle'; // 부드러운 톤
            osc.frequency.setValueAtTime(Math.random() * 100 + 100, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(Math.random() * 50 + 50, audioCtx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.01, audioCtx.currentTime); // 아주 작게
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        // --- [1. ASMR 잔디밭 생성 (만지는 느낌 구현)] ---
        const grassArea = document.getElementById('grass-area');
        const bladeCount = window.innerWidth / 12; // 화면 너비에 맞춰 잔디 개수 조절
        
        for (let i = 0; i < bladeCount; i++) {
            const blade = document.createElement('div');
            blade.className = 'grass-blade';
            blade.style.left = (i * 12) + 'px';
            // 높이와 애니메이션 속도를 약간 랜덤하게 줘서 자연스럽게
            blade.style.height = (Math.random() * 20 + 50) + 'px';
            blade.style.animation = `sway ${Math.random() * 2 + 3}s ease-in-out infinite`;
            blade.style.animationDelay = `${Math.random() * 2}s`;
            
            // 잔디를 만졌을 때 (Hover) 소리와 카운트 증가
            blade.addEventListener('mouseover', () => {
                playRustleSound();
                updateStats();
            });
            
            grassArea.appendChild(blade);
        }

        // --- [2. 통계 및 나무 성장 로직] ---
        function updateStats() {
            touchCount++;
            touchStat.innerText = `만짐: ${touchCount}`;
            
            // 나무 레벨업 레시피 (레벨 * 50번 만질 때마다 레벨업)
            const nextLevelReq = treeLevel * 50;
            if (touchCount >= nextLevelReq) {
                treeLevel++;
                levelStat.innerText = `나무 레벨: ${treeLevel}`;
                levelStat.style.color = '#4caf50';
                levelStat.style.fontWeight = 'bold';
                setTimeout(()=> levelStat.style.color = '#475569', 1000);
                
                growTree();
            }
        }

        function growTree() {
            // 레벨에 맞춰 기둥 높이와 잎사귀 가시성 조절
            const newHeight = treeLevel * 20; 
            trunk.style.height = newHeight + 'px';
            
            // 레벨 3부터 잎사귀가 나타남
            if (treeLevel >= 3) {
                leaves.style.opacity = '1';
                leaves.style.transform = `translateY(-${newHeight}px)`; // 기둥 끝으로 이동
            }
        }

        // 초기 나무 높이 설정
        growTree();

        // --- [3. 클릭 상호작용 (꽃 피우기)] ---
        const flowers = ['🌸', '🌼', '🌻', '🌷', '🌿', '🍀'];
        garden.addEventListener('click', (e) => {
            // 패널 클릭 시엔 작동안함
            if (e.target.closest('.interaction-panel')) return;
            
            // 잔디밭 영역(하단 50%)
            if (e.clientY < window.innerHeight * 0.5) return;

            // 만짐 카운트 5 증가 (클릭 보너스)
            for(let i=0; i<5; i++) updateStats();

            const plant = document.createElement('div');
            plant.className = 'plant pop-effect';
            plant.style.left = e.clientX + 'px';
            plant.style.top = e.clientY + 'px';
            plant.innerText = flowers[Math.floor(Math.random() * flowers.length)];
            garden.appendChild(plant);

            // 3초 후 꽃 제거
            setTimeout(() => {
                plant.style.opacity = '0';
                plant.style.transition = 'opacity 1s';
                setTimeout(() => plant.remove(), 1000);
            }, 3000);
        });

    </script>
</body>
</html>
