<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>求援 - 힐링 정원</title>
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.2);
    }

    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; font-family: 'Apple SD Gothic Neo', sans-serif;
      background-color: #1a1a2e; /* 기본 배경색 */
      background-size: cover;
      background-position: center;
    }

    /* --- [헤더 & 사이드바: 유리 스타일] --- */
    .header {
      position: fixed; top: 0; width: 100%; z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 25px; box-sizing: border-box;
      background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
      border-bottom: 1px solid var(--glass-border);
    }
    .logo { font-weight: 800; font-size: 22px; color: #fff; cursor: pointer; }
    .logo .dot { color: #a7d08c; }

    .sidebar {
      position: fixed; left: 20px; top: 85px; width: 180px; z-index: 1000;
      background: var(--glass-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border-radius: 20px; padding: 10px; border: 1px solid var(--glass-border);
    }
    .menu-item {
      padding: 12px 15px; margin-bottom: 5px; cursor: pointer; border-radius: 12px;
      transition: 0.3s; color: rgba(255,255,255,0.8); font-size: 14px;
    }
    .menu-item:hover { background: rgba(255,255,255,0.1); color: #fff; transform: translateX(5px); }

    /* --- [정원 레이아웃] --- */
    #garden-container {
      width: 100vw; height: 100vh; position: relative;
    }

    /* 캐릭터 이미지 (seer.png) */
    .character-bench {
      position: absolute; right: 5%; bottom: 15%;
      width: 400px; /* 스케치 느낌에 맞춰 크기 조절 */
      z-index: 5;
      pointer-events: none;
    }

    /* 잔디 영역 (스케치하신 하단 지그재그 느낌) */
    #grass-area {
      position: absolute; bottom: 0; width: 100%; height: 150px;
      z-index: 10; display: flex; align-items: flex-end; pointer-events: none;
    }

    .grass-blade {
      flex: 1; background: #000; /* 실루엣 느낌 */
      clip-path: polygon(50% 0%, 0% 100%, 100% 100%); /* 지그재그 삼각형 */
      transform-origin: bottom; transition: 0.2s;
      pointer-events: auto; /* 잔디는 만질 수 있게 */
    }
    .grass-blade:hover {
      background: #4b367c;
      transform: scaleY(1.2) skewX(5deg);
    }

    /* 상단 상태 표시 */
    .garden-info {
      position: absolute; top: 100px; right: 40px; color: #fff;
      text-align: right; pointer-events: none; opacity: 0.7;
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo" onclick="location.href='main.html'">求援<span class="dot">.</span></div>
    <div class="header-right" style="display:flex; gap:15px; align-items:center; color:#fff;">
      <div id="hPoints">0P</div>
      <div id="hNick" style="cursor:pointer" onclick="location.href='mypage.html'">로딩 중...</div>
    </div>
  </header>

  <aside class="sidebar">
    <div class="menu-item" onclick="location.href='qna.html'">📄 문답</div>
    <div class="menu-item" onclick="location.href='talk.html'">👤 잡담</div>
    <div class="menu-item" onclick="location.href='point.html'">💰 포인트 관리</div>
    <div class="menu-item" onclick="location.href='mypage.html'">⚙️ 마이페이지</div>
  </aside>

  <div id="garden-container">
    <div class="garden-info">
      <h2 id="levelText">Level 1. 고요한 옥상</h2>
      <p id="touchCount">보듬어준 횟수: 0</p>
    </div>

    <img src="seer.png" alt="Seer on bench" class="character-bench">

    <div id="grass-area"></div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore.js";

    let count = 0;

    // 1. 배경 및 사용자 데이터 로드 (보내주신 마이페이지 로직 적용)
    onAuthStateChanged(auth, async u => {
      if (!u) return location.href = "login.html";

      const s = await getDoc(doc(db, "users", u.uid));
      if (s.exists()) {
        const d = s.data();
        // 로컬 스토리지 배경 적용
        const localBg = localStorage.getItem(`bg_${u.uid}`);
        if (localBg) {
          document.body.style.backgroundImage = `linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('${localBg}')`;
        }
        document.getElementById("hNick").innerText = d.nickname;
        document.getElementById("hPoints").innerText = (d.points || 0) + "P";
      }
    });

    // 2. 스케치 기반 잔디 생성
    const grassArea = document.getElementById('grass-area');
    const bladeCount = 40; // 지그재그 개수

    for (let i = 0; i < bladeCount; i++) {
      const blade = document.createElement('div');
      blade.className = 'grass-blade';
      // 높이를 랜덤하게 주어 스케치 느낌 살림
      blade.style.height = (Math.random() * 50 + 80) + 'px';
      
      blade.addEventListener('mouseover', () => {
        count++;
        document.getElementById('touchCount').innerText = `보듬어준 횟수: ${count}`;
        // 간단한 ASMR 효과음 코드를 여기에 추가할 수 있습니다.
      });
      
      grassArea.appendChild(blade);
    }
  </script>
</body>
</html>
